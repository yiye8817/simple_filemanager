<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>版本查询管理</title>
    <!-- <link rel="stylesheet" href="css/style.css"> -->
        <link rel="stylesheet" href="{{ url_for('static', filename='version_manager/css/style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">版本查询管理</span>
            <a href="/" class="btn btn-light btn-sm">返回主页</a>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- 查询条件 -->
        <div class="card mb-4">
            <div class="card-header">
                <h5>查询条件</h5>
            </div>
            <div class="card-body">
                <form id="queryForm">
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label class="form-label">系统</label>
                            <input type="text" class="form-control" name="system" value="liangeos">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">类型</label>
                            <select class="form-control" name="type">
                                <option value="">全部</option>
                                <option value="ota">OTA</option>
                                <option value="firmware">Firmware</option>
                            </select>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">厂商</label>
                            <input type="text" class="form-control" name="vendor" placeholder="如：小米">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">设备类型</label>
                            <input type="text" class="form-control" name="device_type" placeholder="如：pad">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label class="form-label">版本号</label>
                            <input type="text" class="form-control" name="version" placeholder="具体版本号">
                        </div>
                        <div class="col-md-9 mb-3 d-flex align-items-end">
                            <button type="button" class="btn btn-primary me-2" onclick="queryVersions()">
                                <i class="bi bi-search"></i> 查询全部
                            </button>
                            <button type="button" class="btn btn-success me-2" onclick="queryLatest()">
                                <i class="bi bi-star"></i> 查询最新
                            </button>
                            <button type="button" class="btn btn-info" onclick="querySpecific()">
                                <i class="bi bi-bullseye"></i> 查询特定版本
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- 查询结果 -->
        <div class="card">
            <div class="card-header">
                <h5>查询结果</h5>
                <span class="badge bg-secondary float-end" id="resultCount">0 条记录</span>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>系统</th>
                                <th>类型</th>
                                <th>厂商</th>
                                <th>设备类型</th>
                                <th>版本号</th>
                                <th>校验和</th>
                                <th>大小</th>
                                <th>时间</th>
                                <th>最新</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="resultList">
                            <tr>
                                <td colspan="11" class="text-center text-muted">请输入查询条件</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <!-- 分页 -->
                <nav aria-label="Page navigation">
                    <ul class="pagination justify-content-center" id="pagination">
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <!-- 详情模态框 -->
    <div class="modal fade" id="detailModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">版本详情</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="detailContent">
                    <!-- 动态加载 -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <!-- <script src="js/query.js"></script> -->
    <script src="{{ url_for('static', filename='version_manager/js/query.js') }}"></script>
</body>
</html>
