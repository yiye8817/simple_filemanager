<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}在线资源管理系统{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style_src.css') }}">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <!-- 2. 然后引入 Bootstrap JS (它会创建全局的 bootstrap 对象) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
   
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/">云端文件管理</a>
            <h1 class="logo">资源管理系统</h1>
            <ul class="nav-menu">
                <li><a href="/api/">资源列表</a></li>
                <li><a href="/api/add">添加资源</a></li>
                <li><a href="/api/import">批量导入</a></li>
            </ul>
        </div>
    </nav>
    
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    
    <script src="{{ url_for('static', filename='js/main_src.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
