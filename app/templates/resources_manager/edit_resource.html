{% extends "resources_manager/base.html" %}

{% block content %}
<div class="form-container">
    <h2>编辑资源</h2>
    <form id="editResourceForm" enctype="multipart/form-data">
        <!-- 表单内容与add_resource.html相同 -->
        <div class="form-group">
            <label for="title">标题 *</label>
            <input type="text" id="title" name="title" class="form-control" required>
        </div>
        
        <!-- 其他表单字段... (与add_resource.html相同) -->
              <div class="form-group">
            <label for="resource_link">资源链接 *</label>
            <input type="url" id="resource_link" name="resource_link" class="form-control" required>
        </div>
        
        <div class="form-group">
            <label for="category">分类 *</label>
            <div class="category-input-group">
                <select id="category" name="category" class="form-control" required>
                    <option value="">选择分类</option>
                    <option value="视频">视频</option>
                    <option value="音频">音频</option>
                    <option value="文档">文档</option>
                    <option value="应用">应用</option>
                    <option value="链接">链接</option>
                    <option value="其他">其他</option>
                </select>
                <input type="text" id="categoryInput" class="form-control" placeholder="或输入新分类">
                <button type="button" onclick="loadExistingCategories()" class="btn btn-secondary">查询已有分类</button>
            </div>
            <div id="existingCategories" class="existing-categories"></div>
        </div>
        
        <div class="form-group">
            <label for="subcategory">子类</label>
            <input type="text" id="subcategory" name="subcategory" class="form-control">
        </div>
        
        <div class="form-group">
            <label for="poster">资源海报</label>
            <input type="file" id="poster" name="poster" class="form-control" accept="image/*">
            <small>或者输入海报URL：</small>
            <input type="url" id="poster_url" name="poster_url" class="form-control" placeholder="海报URL">
        </div>
        
        <div class="form-group">
            <label for="tags">特征字（标签）</label>
            <input type="text" id="tags" name="tags" class="form-control" placeholder="用逗号分隔多个标签">
        </div>
        
        <div class="form-group">
            <label for="author">作者</label>
            <input type="text" id="author" name="author" class="form-control">
        </div>
        
        <div class="form-group">
            <label for="source">来源</label>
            <input type="text" id="source" name="source" class="form-control">
        </div>
        
        <div class="form-group">
            <label for="proxy">代理</label>
            <input type="text" id="proxy" name="proxy" class="form-control">
        </div>
        
        <div class="form-group">
            <label for="rating">评分</label>
            <input type="number" id="rating" name="rating" class="form-control" min="0" max="5" step="0.1" value="0">
        </div>
        
        <div class="form-group">
            <label for="details">详细信息</label>
            <textarea id="details" name="details" class="form-control" rows="4"></textarea>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">更新资源</button>
            <a href="/" class="btn btn-secondary">取消</a>
        </div>
    </form>
</div>

<script>
const resourceId = {{ resource_id }};

// 加载资源数据
async function loadResource() {
    try {
        const response = await axios.get(`/api/resources/${resourceId}`);
        const resource = response.data;
        console.log(resource)
        // 填充表单
        document.getElementById('title').value = resource.title || '';
        document.getElementById('resource_link').value = resource.resource_link || '';
        document.getElementById('category').value = resource.category || '';
        document.getElementById('subcategory').value = resource.subcategory || '';
        document.getElementById('tags').value = resource.tags || '';
        document.getElementById('author').value = resource.author || '';
        document.getElementById('source').value = resource.source || '';
        document.getElementById('proxy').value = resource.proxy || '';
        document.getElementById('rating').value = resource.rating || 0;
        document.getElementById('details').value = resource.details || '';
        document.getElementById('poster_url').value = resource.poster_url || '';
    } catch (error) {
        console.error('加载资源失败:', error);
        alert('加载资源失败');
    }
}

document.getElementById('editResourceForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const formData = new FormData(e.target);
    
    try {
        const response = await axios.put(`/api/resources/${resourceId}`, formData, {
            headers: {
                'Content-Type': 'multipart/form-data'
            }
        });
        
        alert('资源更新成功！');
        window.location.href = '/api/';
    } catch (error) {
        console.error('更新失败:', error);
        alert('更新失败: ' + (error.response?.data?.error || '未知错误'));
    }
});

// 页面加载时加载资源数据
document.addEventListener('DOMContentLoaded', loadResource);
</script>
{% endblock %}
